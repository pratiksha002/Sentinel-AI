# Swarm Configuration File
swarm:
  num_drones: 1
  formation_type: "triangle"  # Options: line, triangle, square, circle
  formation_scale: 2.0  # Distance in meters between drones in formation
  control_frequency: 50  # Hz
  mission_timeout: 120  # seconds

drones:
  drone_1:
    drone_id: 1
    start_position: [0.0, 0.0, 1.0]
    formation_offset: [0.0, 0.0, 0.0]  # Leader position
    is_leader: true
  
  drone_2:
    drone_id: 2
    start_position: [1.5, 1.0, 1.0]
    formation_offset: [1.5, 1.0, 0.0]
    is_leader: false
  
  drone_3:
    drone_id: 3
    start_position: [1.5, -1.0, 1.0]
    formation_offset: [1.5, -1.0, 0.0]
    is_leader: false
  
  drone_4:
    drone_id: 4
    start_position: [3.0, 0.0, 1.0]
    formation_offset: [3.0, 0.0, 0.0]
    is_leader: false
  
  drone_5:
    drone_id: 5
    start_position: [-1.5, 0.0, 1.0]
    formation_offset: [-1.5, 0.0, 0.0]
    is_leader: false

# PID Controller Gains
pid_gains:
  position:
    kp: 1.0
    ki: 0.05
    kd: 0.3
  velocity:
    kp: 0.5
    ki: 0.02
    kd: 0.1
  attitude:
    kp: 4.5
    ki: 0.05
    kd: 0.15

# Safety limits
safety:
  max_velocity: 5.0  # m/s
  max_acceleration: 5.0  # m/s^2
  min_altitude: 0.5  # m
  max_altitude: 50.0  # m
  communication_timeout: 5.0  # seconds
  formation_error_threshold: 1.5  # meters
  battery_warning_threshold: 20.0  # percent
  battery_critical_threshold: 10.0  # percent

# Mission waypoints
mission:
  waypoints:
    - [0.0, 0.0, 2.0]      # Start hover
    - [5.0, 0.0, 2.0]      # Move to midpoint
    - [10.0, 0.0, 2.0]     # Move to destination
    - [10.0, 0.0, 0.5]     # Descend for landing
  
  mission_name: "formation_flight_a_to_b"
  description: "5 drones flying in formation from point A to point B"

# Switch to 1 drone
#sed -i 's/num_drones: [0-9]/num_drones: 1/' ~/.config/sentinel.yaml && colcon build

# Switch to 2 drones
#sed -i 's/num_drones: [0-9]/num_drones: 2/' ~/.config/sentinel.yaml && colcon build

